.ctl button[aria-pressed=true]{border-color:var(--acc);font-weight:600}.ctl input[type=range]{flex:1;min-width:200px}
.tl{font-variant-numeric:tabular-nums;min-width:170px;text-align:center;font-weight:600}

</style></head><body>
<header><h1>Kalshi 2026 midterms: did the market call it?</h1>
<p>Start-of-night prices (4:19pm ET, Nov 3) against certified winners. Early build.</p></header>
<nav role="tablist" aria-label="Views" id="tabs"></nav>
<main>
 <div id="stage"></div>
 <aside id="side" aria-live="polite"><h2>Hover or tap a state</h2><p style="color:var(--mut);margin:0;font-size:13px">Details for the race show here.</p></aside>
</main>
<script>
const P=__PAYLOAD__, NS="http://www.w3.org/2000/svg";
const TABS=[["time","Timing"],["profit","Profit"],["results","Results"]];
const side=document.getElementById("side"), stage=document.getElementById("stage"), tabs=document.getElementById("tabs");
const pct=x=>x==null?"n/a":Math.round(x*100)+"¢";
function cls(d){ if(!d) return "norace"; if(!d.scored) return "nomkt"; return d.fav_correct?"ok":"bad"; }
function mapSvg(kind){
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`${P.geo.x0} 0 ${P.geo.width} ${P.geo.height}`);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label","US map of "+kind+" races");
  for(const s of P.geo.states){
    const d=kind?P.data[kind][s.abbr]:null, c=kind?cls(d):"norace", p=document.createElementNS(NS,"path");
    p.setAttribute("d",s.d); p.setAttribute("class","state"+(d?" hit":"")); p.style.fill=`var(--${c==="norace"?"norace":c==="nomkt"?"nomkt":c})`;
    p.dataset.abbr=s.abbr; p.setAttribute("tabindex",d?0:-1); p.setAttribute("aria-label",s.name+(d?`: ${d.winner} won`:": no 2026 race"));
    const show=()=>{ show_(s,d,kind); }; p.addEventListener("mouseenter",show); p.addEventListener("focus",show);
    p.addEventListener("click",()=>{svg.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));p.classList.add("sel");show();});
    svg.appendChild(p);
  }
  const b=document.createElementNS(NS,"path"); b.setAttribute("d",P.geo.borders); b.setAttribute("class","borders"); svg.appendChild(b);
  return svg;
}
function houseSvg(){
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`${P.geo.x0} 0 ${P.geo.width} ${P.geo.height}`);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label","US map of House districts");
  for(const x of P.districts){
    const d=P.data.house[x.key], p=document.createElementNS(NS,"path");
    const c=x.key==="DC-AL"?"norace":!d?"pend":cls(d);
    p.setAttribute("d",x.d); p.setAttribute("class","dist"); p.style.fill=`var(--${c==="nomkt"?"nomkt":c})`; p.setAttribute("tabindex",0);
    p.setAttribute("aria-label",x.key+(d?`: ${d.winner} won`:": no result in winners table"));
    const show=()=>showHouse(x.key,d); p.addEventListener("mouseenter",show); p.addEventListener("focus",show);
    p.addEventListener("click",()=>{svg.querySelectorAll(".sel").forEach(e=>e.classList.remove("sel"));p.classList.add("sel");show();});
    svg.appendChild(p);
  }
  const b=document.createElementNS(NS,"path"); b.setAttribute("d",P.geo.borders); b.setAttribute("class","borders"); b.style.strokeWidth="1.2"; svg.appendChild(b);
  return svg;
}
let curTab="";
function resInfo(){
  if(curTab!=="results") return "";
  const rows=[["House","house"],["Senate","sen"],["Governor","gov"],["All","all"]].map(([l,k])=>{
    const a=(k==="all"?["house","sen","gov"]:[k]).flatMap(kk=>Object.values(P.data[kk]).filter(d=>d.scored&&d.p_dem_start!=null));
    const n=a.length, ok=a.filter(d=>d.fav_correct).length, br=a.reduce((t,d)=>t+Math.pow(d.p_dem_start-(d.dem_won?1:0),2),0)/(n||1);
    return `<tr><td>${l}</td><td>${n}</td><td>${ok} (${(ok/(n||1)*100).toFixed(1)}%)</td><td>${n-ok}</td><td>${br.toFixed(4)}</td></tr>`;}).join("");
  const wk=t=>`<a href="https://en.wikipedia.org/wiki/${t}" target="_blank" rel="noopener">${t.replace(/_/g," ").replace(/#.*/,"")}</a>`;
  return `<div class="resinfo"><h3>Start-of-night accuracy</h3><table class="tr"><tr><th></th><th>Races</th><th>Favorite won</th><th>Upsets</th><th>Brier</th></tr>${rows}</table>`
   +`<p class="note">Scored on the Kalshi price at the first usable snapshot, for races with a matched D/R market. A Brier score of 0 is perfect and 0.25 is a coin flip.</p>`
   +`<p class="note">This simulator is constructed using real Kalshi data collected over a 24 hour period starting on 4pm election day, just before the first polls closed.</p>`
   +`<h3>Sources</h3><p class="note">Winners: scraped from Wikipedia, ${wk("2026_United_States_House_of_Representatives_elections")}, ${wk("2026_United_States_Senate_elections")} and ${wk("2026_United_States_gubernatorial_elections")} (saved as <code>winners_reference.csv</code>). Prices: Kalshi public API.</p>`
   +`<p class="note">Map: U.S. Census Bureau TIGER/Line 2026 legislative geodatabase (120th Congress districts), clipped to shorelines with the Census cartographic boundary file cb_2025_us_cd119_500k.</p></div>`;
}
function showHouse(key,d){
  let h=`<h2>${key}</h2>`;
  if(!d){ side.innerHTML=h+`<p style="color:var(--mut);margin:0">No result in the winners table (runoff or recount).</p>`+resInfo(); return; }
  const s=P.geo.states.find(z=>z.abbr===key.slice(0,2)); show_({name:key+(s?" ("+s.name+")":"")},d);
}
function show_(s,d,kind){
  let h=`<h2>${s.name}${kind?" · "+({sen:"Senate",gov:"Governor"}[kind]||""):""}</h2>`;
  if(!d){ side.innerHTML=h+`<p style="color:var(--mut);margin:0">No 2026 race here.</p>`+resInfo(); return; }
  h+=`<dl><dt>Winner</dt><dd>${d.winner} (${d.party})</dd>`;
  if(d.scored){
    h+=`<dt>Kalshi start P(Dem)</dt><dd>${pct(d.p_dem_start)}</dd><dt>Market favorite</dt><dd>${d.kalshi_fav==="D"?"Democrat":"Republican"}</dd>`
     +`<dt>Called right?</dt><dd>${d.fav_correct?"Yes":"<b>No, upset</b>"}</dd><dt>Settled at 95¢+</dt><dd>${d.t_collapse_et||(d.status==="never_collapsed"?"never":"already at start")}</dd>`
     +`<dt>Buy fav, per contract</dt><dd>${d.pnl_buy_fav>=0?"+":""}${(d.pnl_buy_fav*100).toFixed(0)}¢</dd>`;
  } else h+=`<dt>Kalshi</dt><dd>no D/R market matched</dd>`;
  side.innerHTML=h+"</dl>"+resInfo();
}
function legend(){return `<div class="legend"><span><i style="background:var(--ok)"></i>Favorite won</span><span><i style="background:var(--bad)"></i>Upset</span><span><i style="background:var(--nomkt)"></i>No Kalshi market matched</span><span><i style="background:var(--norace)"></i>No 2026 race</span></div>`;}
const T=P.timing, TN=T.times.length;
let tKind="house", tIdx=0, timer=null, tPaths={};
const fmtET=iso=>new Date(iso).toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function pwin(kind,key,i){const s=T.series[kind][key],d=P.data[kind][key]; if(!s||s[i]==null||!d) return null; return d.dem_won?s[i]:1-s[i];}
function tcls(pw){return pw==null?"nomkt":pw>=.95?"ok":pw>=.75?"t3":pw>=.5?"pend":"bad";}
function tKeys(){return Object.keys(T.series[tKind]);}
function paintTiming(){
  let settled=0,behind=0,n=0;
  for(const [key,p] of Object.entries(tPaths)){
    const pw=pwin(tKind,key,tIdx); const c=tcls(pw); p.style.fill=`var(--${c})`;
    if(pw!=null){n++; if(pw>=.95) settled++; if(pw<.5) behind++;}
  }
  document.getElementById("tlabel").textContent=fmtET(T.times[tIdx])+" ET";
  document.getElementById("tsum").textContent=`${settled} of ${n} races settled on the winner (95¢+) · ${behind} with the winner behind (<50¢)`;
  document.getElementById("trange").value=tIdx; drawCurve(); paintBest();
}
function curveShare(i){let s=0,n=0;for(const k of tKeys()){const pw=pwin(tKind,k,i); if(pw!=null){n++; if(pw>=.95)s++;}} return n?s/n:0;}
function drawCurve(){
  const W=820,H=110,pad=44, el=document.getElementById("curve"); const shares=[...Array(TN).keys()].map(curveShare), lo=Math.floor(Math.min(...shares)*10)/10; const x=i=>pad+(W-2*pad)*i/(TN-1), y=v=>H-18-(H-34)*(v-lo)/(1-lo);
  let d=""; for(let i=0;i<TN;i++) d+=(i?"L":"M")+x(i).toFixed(1)+" "+y(shares[i]).toFixed(1);
  el.innerHTML=`<line x1="${pad}" x2="${W-pad}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/><line x1="${pad}" x2="${W-pad}" y1="${y(1)}" y2="${y(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>`
   +`<text x="${pad-4}" y="${y(1)+4}" text-anchor="end" font-size="6" fill="var(--mut)">100%</text><text x="${pad-4}" y="${y(lo)+4}" text-anchor="end" font-size="6" fill="var(--mut)">${Math.round(lo*100)}%</text>`
   +`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/><line x1="${x(tIdx)}" x2="${x(tIdx)}" y1="6" y2="${y(lo)}" stroke="var(--fg)" stroke-width="1.5"/>`
   +`<text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="11" fill="var(--mut)">Share of races settled on the winner, by snapshot (click to jump)</text>`;
  el.dataset.pad=pad;
}
function spark(kind,key){
  const W=250,H=70; let d="",mark=""; const s=T.series[kind][key]; if(!s) return "";
  for(let i=0;i<TN;i++){const pw=pwin(kind,key,i); if(pw==null) continue; d+=(d?"L":"M")+(4+(W-8)*i/(TN-1)).toFixed(1)+" "+(H-4-(H-8)*pw).toFixed(1);}
  const cx=4+(W-8)*tIdx/(TN-1);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px"><line x1="4" x2="${W-4}" y1="${H-4-(H-8)*.95}" y2="${H-4-(H-8)*.95}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="4" x2="${W-4}" y1="${H-4-(H-8)*.5}" y2="${H-4-(H-8)*.5}" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="1.8"/><line x1="${cx}" x2="${cx}" y1="2" y2="${H-2}" stroke="var(--fg)"/></svg><div style="font-size:11px;color:var(--mut)">Winner's price over time (dashed = 95¢, solid = 50¢)</div>`;
}
const BET=5;
function bestBuys(){
  const rows=[];
  for(const [key,d] of Object.entries(P.data[tKind])){
    const s=T.series[tKind][key]; if(!s||s[tIdx]==null) continue;
    const a=(d.dem_won?T.askD:T.askR)[tKind][key][tIdx]; const ask=a!=null?a:(pwin(tKind,key,tIdx)+0.01);
    if(!(ask>=0.03&&ask<0.99)) continue;           // skip no-offer / sub-3-cent quotes: not realistically fillable
    const n=Math.floor(BET/ask); if(n<1) continue;
    rows.push({key,d,ask,n,cost:n*ask,payout:n,gain:n-n*ask});
  }
  return rows.sort((a,b)=>b.gain-a.gain).slice(0,5);
}
function paintBest(){
  const el=document.getElementById("best"); if(!el) return;
  const rows=bestBuys(), name={house:"House",sen:"Senate",gov:"Governor"}[tKind];
  el.innerHTML=`<h2>Best buys now</h2><small>${name}, hindsight: $${BET} on the eventual winner at the ask, paid $1 per contract at close. Ignores fees and order depth.</small><ol>`
   +rows.map(r=>`<li><b>${r.key}</b> ${r.d.winner}<br><small>${Math.round(r.ask*100)}¢ × ${r.n} contracts = $${r.cost.toFixed(2)}</small><br>pays $${r.payout.toFixed(2)} <span class="gain">(+$${r.gain.toFixed(2)})</span></li>`).join("")+`</ol>`;
}
function timingHover(key,label){
  const d=P.data[tKind][key]; if(!d){return;}
  const pw=pwin(tKind,key,tIdx);

let pIdx=0, pBudget=1000, pCap=25, pKind="all", pTimer=null, pCache=null;
const money=x=>(x<0?"-":"")+"$"+Math.abs(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
/* ---------- trading strategies that buy and sell through the night ---------- */
const TRADE_END=()=>TN-2;  // last step we trade on; the final snapshot is settlement, so everything is closed before it
function raceSides(){
  const out=[];
  for(const kind of (pKind==="all"?["house","sen","gov"]:[pKind])) for(const key of Object.keys(P.data[kind])){
    const s=T.series[kind][key]; if(!s) continue;
    for(const side of ["D","R"]){
      const a=[],b=[],m=[];
      for(let i=0;i<TN;i++){a.push(askSide(kind,key,side,i)); b.push(bidSide(kind,key,side,i)); m.push(midSide(kind,key,side,i));}
      out.push({kind,key,side,a,b,m,name:nameOf?nameOf(kind,key,side):""});
    }
  }
  return out;
}
function tradeRow(r,t0,t1,n,ask,bid){
  return {label:r.key,pick:r.name||(r.side==="D"?"Dem":"Rep"),t0,t1,ask,bid,n,cost:n*ask,payout:n*bid,r};
}
// total profit at step t: cash plus open positions marked at the mid, minus the starting budget
function equityAt(cash,open,t){let v=0; for(const o of open){const m=o.r.m[t]; v+=o.n*(m==null?o.ask:m);} return cash+v-pBudget;}
function stratForesight(){
  const H=TRADE_END(), trips=[];
  for(const r of raceSides()){
    const f=new Array(H+1).fill(0), prev=new Array(H+1).fill(-1);  // f[j]: best gain per contract if flat at step j
    for(let j=1;j<=H;j++){
      f[j]=f[j-1]; prev[j]=-1;
      if(r.b[j]==null) continue;
      for(let i=0;i<j;i++){ if(r.a[i]==null||r.a[i]>=.99||r.a[i]<.015) continue; const c=f[i]+r.b[j]-r.a[i]; if(c>f[j]+1e-9){f[j]=c; prev[j]=i;} }
    }
    let j=H; while(j>0){ if(prev[j]===-1){j--;continue;} const i=prev[j]; trips.push({r,i,j,ask:r.a[i],bid:r.b[j]}); j=i; }
  }
  let cash=pBudget, open=[]; const done=[], eq=[];
  for(let t=0;t<TN;t++){
    if(t<=H){
      for(const o of open) if(o.j===t){ cash+=o.n*o.bid; done.push(tradeRow(o.r,o.i,o.j,o.n,o.ask,o.bid)); }
      open=open.filter(o=>o.j!==t);
      const buys=trips.filter(x=>x.i===t).sort((a,b)=>(b.bid-b.ask)/b.ask-(a.bid-a.ask)/a.ask);
      for(const x of buys){ const n=Math.floor(Math.min(pCap,cash)/x.ask+1e-9); if(n<1) continue; cash-=n*x.ask; open.push({...x,n}); }
    }
    eq.push(equityAt(cash,open,Math.min(t,H)));
  }
  return {tr:done,eq};
}
/* ---------- buy-and-hold baskets (held to settlement) ---------- */
function racePairs(){
  const m=new Map();
  for(const r of raceSides()){const k=r.kind+"|"+r.key; if(!m.has(k)) m.set(k,{}); m.get(k)[r.side]=r;}
  const out=[];
  for(const x of m.values()){
    if(!x.D||!x.R||P.data[x.D.kind][x.D.key].dem_won==null) continue;
    const e0=x.D.a.findIndex((v,i)=>v!=null&&x.R.a[i]!=null&&x.D.m[i]!=null); if(e0<0) continue;
    out.push({D:x.D,R:x.R,e0,pD:x.D.m[e0]});
  }
  return out;
}
const sideWins=r=>(r.side==="D")===P.data[r.kind][r.key].dem_won;
// picks: [{r,t,ask,n}] bought at step t and held to the last snapshot, which pays $1 or $0
function holdResult(picks){
  const tr=picks.filter(x=>x.n>=1).map(x=>tradeRow(x.r,x.t,TN-1,x.n,x.ask,sideWins(x.r)?1:0)), eq=[];
  for(let t=0;t<TN;t++){
    let cash=pBudget, v=0;
    for(const x of tr){ if(x.t0>t) continue; cash-=x.cost; if(t>=TN-1) v+=x.payout; else {const m=x.r.m[t]; v+=x.n*(m==null?x.ask:m);} }
    eq.push(cash+v-pBudget);
  }
  return {tr,eq};
}
const perRace=n=>Math.min(pCap,pBudget/Math.max(1,n));
function stratBasket(side){   // buy one side in every contested race (start price 20-80¢) at the first snapshot
  const c=racePairs().filter(x=>x.pD>=.2&&x.pD<=.8), per=perRace(c.length);
  return holdResult(c.map(x=>{const r=x[side],ask=r.a[x.e0]; return {r,t:x.e0,ask,n:Math.floor(per/ask+1e-9)};}));
}
function stratLongshot(){   // buy every side priced 2-10¢ at the first snapshot
  const c=[]; for(const x of racePairs()) for(const r of [x.D,x.R]){const a=r.a[x.e0]; if(a>=.02&&a<=.10) c.push({r,t:x.e0,ask:a});}
  const per=perRace(c.length); return holdResult(c.map(x=>({...x,n:Math.floor(per/x.ask+1e-9)})));
}
function stratGrinder(){    // buy a side the first time its ask is 90-97¢ (one side per race), spending up to the cap while cash lasts
  const rs=racePairs(), bought=new Set(), picks=[]; let cash=pBudget;
  for(let t=0;t<TN-1;t++){
    const c=[]; for(const x of rs){ const k=x.D.key+x.D.kind; if(bought.has(k)) continue; for(const r of [x.D,x.R]){const a=r.a[t]; if(a!=null&&a>=.90&&a<=.97) c.push({r,k,a});} }
    c.sort((p,q)=>q.a-p.a);
    for(const x of c){ if(bought.has(x.k)) continue; const n=Math.floor(Math.min(pCap,cash)/x.a+1e-9); if(n<1) continue; cash-=n*x.a; bought.add(x.k); picks.push({r:x.r,t,ask:x.a,n}); }
  }
  return holdResult(picks);
}
function stratHedge(){      // hold both sides of every race at the first snapshot, 70% of the money on the favorite and 30% on the other side
  const rs=racePairs(), per=perRace(rs.length), picks=[];
  for(const x of rs){ const fav=x.pD>=.5?x.D:x.R, und=fav===x.D?x.R:x.D;
    picks.push({r:fav,t:x.e0,ask:fav.a[x.e0],n:Math.floor(.7*per/fav.a[x.e0]+1e-9)},{r:und,t:x.e0,ask:und.a[x.e0],n:Math.floor(.3*per/und.a[x.e0]+1e-9)}); }
  return holdResult(picks);
}
function eqChart(eq,t,color){
  const W=360,Hh=130,pl=44,pr=8,pt=8,pb=16, lo=Math.min(0,...eq), hi=Math.max(0,...eq), span=(hi-lo)||1;

  const part=eq.slice(0,t+1).map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const k=v=>(v<0?"-":"")+"$"+Math.abs(Math.round(v)).toLocaleString("en-US");
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%;height:auto" role="img" aria-label="Profit over the night"><line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#c9d0d8" stroke-dasharray="3 3"/>`
   +`<polyline points="${pts}" fill="none" stroke="#c9d0d8" stroke-width="1.5"/><polyline points="${part}" fill="none" stroke="${color}" stroke-width="2"/>`
   +`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${Hh-pb}" stroke="#7a8794" stroke-width="1"/><circle cx="${X(t)}" cy="${Y(eq[t])}" r="3.5" fill="${color}"/>`
   +`<text x="${pl-4}" y="${Y(hi)+4}" font-size="6" text-anchor="end" fill="#667">${k(hi)}</text><text x="${pl-4}" y="${Y(lo)+3}" font-size="6" text-anchor="end" fill="#667">${k(lo)}</text>`
   +`<text x="${pl}" y="${Hh-3}" font-size="6" fill="#667">${fmtET(T.times[0]).replace(/^\w+, /,"")}</text><text x="${W-pr}" y="${Hh-3}" font-size="6" text-anchor="end" fill="#667">${fmtET(T.times[TN-1]).replace(/^\w+, /,"")}</text></svg>`;
}
function traderCard(title,sub,res,color){
  const t=pIdx, pl=res.eq[t], closed=res.tr.filter(x=>x.t1<=t), openN=res.tr.filter(x=>x.t0<=t&&x.t1>t).length, wins=closed.filter(x=>x.payout>x.cost).length;

let pSub="sim";
let sIdx=0,sCash=1000,sBet=25,sStart=1000,sPos={},sEq=[0],sState=null,sTimer=null,sSpeed=400,sCards=[];
const sKey=(k,key,side)=>k+"|"+key+"|"+side;
const rLabel=(k,key)=>k==="house"?key:key+(k==="sen"?" Sen":" Gov");
const settledAt=m=>m!=null&&(m>=.995||m<=.005);
function sReset(){clearInterval(sTimer);sTimer=null;sIdx=0;sCash=sStart;sPos={};sEq=[0];}
function midSide(k,key,side,i){const s=T.series[k][key]; if(!s||s[i]==null) return null; return side==="D"?s[i]:1-s[i];}
function askSide(k,key,side,i){const a=(side==="D"?T.askD:T.askR)[k][key]; const v=a?a[i]:null; if(v!=null) return v; const m=midSide(k,key,side,i); return m==null?null:Math.min(1,m+.01);}
function bidSide(k,key,side,i){const a=(side==="D"?T.bidD:T.bidR)[k][key]; const v=a?a[i]:null; if(v!=null&&v>0) return v; const m=midSide(k,key,side,i); return m==null?null:Math.max(0,m-.01);}
function posValue(p,i){ if(i>=TN-1){const d=P.data[p.kind][p.key]; return (p.side==="D")===d.dem_won?p.n:0;} const m=midSide(p.kind,p.key,p.side,i); return p.n*(m==null?p.cost/p.n:m); }
function totals(i){let v=0,c=0; for(const p of Object.values(sPos)){v+=posValue(p,i);c+=p.cost;} return {cash:sCash,openPL:v-c,total:sCash+v-sStart};}
function flash(msg){const e=document.getElementById("sflash"); if(!e) return; e.textContent=msg; clearTimeout(flash.t); flash.t=setTimeout(()=>e.textContent="",2500);}
function sBuy(kind,key,side){
  if(sIdx>=TN-1){flash("Market closed: press Reset to start over."); return;}
  const ask=askSide(kind,key,side,sIdx); if(ask==null||ask<=0||ask>=.99){flash("No fillable price on that side right now."); return;}
  const n=Math.floor(sBet/ask+1e-9), cost=n*ask;
  if(n<1){flash("Bet size is too small for one contract."); return;}
  if(cost>sCash+1e-9){flash("Not enough cash."); return;}
  sCash-=cost; const k=sKey(kind,key,side); const p=sPos[k]||(sPos[k]={kind,key,side,n:0,cost:0}); p.n+=n; p.cost+=cost;
  flash(`Bought ${n} ${side==="D"?"Dem":"Rep"} ${rLabel(kind,key)} at ${Math.round(ask*100)}¢ for ${money(cost)}`);
  sEq[sIdx]=totals(sIdx).total; sPaint();
}
function sSell(k){
  const p=sPos[k]; if(!p||sIdx>=TN-1) return; const m=midSide(p.kind,p.key,p.side,sIdx);
  if(settledAt(m)){flash("Already settled: pays out at the close."); return;}
  const bid=bidSide(p.kind,p.key,p.side,sIdx); if(!(bid>0)){flash("No bid right now."); return;}
  sCash+=p.n*bid; flash(`Sold ${p.n} ${rLabel(p.kind,p.key)} at ${Math.round(bid*100)}¢`); delete sPos[k]; sEq[sIdx]=totals(sIdx).total; sPaint();
}
function sAdvance(to){ for(let i=sIdx+1;i<=to;i++) sEq[i]=totals(i).total; sIdx=to; if(sIdx>=TN-1){clearInterval(sTimer);sTimer=null;} sPaint(); }
function sMoneyCls(x){return x>0.004?"pos":x<-0.004?"neg":"";}
function sPaintSummary(){
  const t=totals(sIdx), fin=sIdx>=TN-1;
  document.getElementById("scash").textContent=money(sCash);
  const o=document.getElementById("sopen"); o.textContent=(t.openPL>=0?"+":"")+money(t.openPL); o.className=sMoneyCls(t.openPL);
  const tt=document.getElementById("stotal"); tt.textContent=(t.total>=0?"+":"")+money(t.total); tt.className=sMoneyCls(t.total);
  document.getElementById("sfinal").textContent=fin?"FINAL: markets settled":"";
  document.getElementById("stime").textContent=fmtET(T.times[sIdx])+" ET";
  document.getElementById("srange").value=sIdx;
  document.getElementById("splay").textContent=sTimer?"Pause":"Play";
}
function sPaintMap(){
  const byState={}; for(const p of Object.values(sPos)){const st=p.key.slice(0,2); byState[st]=(byState[st]||0)+posValue(p,sIdx)-p.cost;}
  document.querySelectorAll("#smap path[data-st]").forEach(el=>{
    const st=el.dataset.st, v=byState[st]; el.style.fill=v==null?"var(--simfill)":v>0.004?"var(--ok)":v<-0.004?"var(--bad)":"var(--acc)";
    el.classList.toggle("sel",st===sState);
  });
}
function sPaintCards(){
  const fin=sIdx>=TN-1;
  for(const c of sCards){
    const m=c.tradable?midSide(c.kind,c.key,"D",sIdx):null;
    if(m==null){c.price.textContent=c.tradable?"no quote":"no market"; for(const b of [c.bD,c.bR]){b.disabled=true; b.querySelector(".px").textContent="Buy";}}
    else{
      c.price.innerHTML=`Dem <b>${Math.round(m*100)}¢</b>`;
      for(const [b,side] of [[c.bD,"D"],[c.bR,"R"]]){ const a=askSide(c.kind,c.key,side,sIdx); const ok=!fin&&a!=null&&a>0&&a<.99; b.disabled=!ok; b.querySelector(".px").textContent=a==null?"Buy":`Buy ${Math.round(a*100)}¢`; }
    }
    const held=["D","R"].map(s=>sPos[sKey(c.kind,c.key,s)]&&`${sPos[sKey(c.kind,c.key,s)].n} ${s==="D"?"Dem":"Rep"}`).filter(Boolean);
    c.hold.textContent=held.length?"Holding "+held.join(", "):"";
  }
}
const nameOf=(k,key,side)=>(P.names[k][key]&&P.names[k][key][side])||(side==="D"?"Democrat":"Republican");
function sPaintPositions(){
  const el=document.getElementById("spos"), fin=sIdx>=TN-1, rows=Object.entries(sPos);
  if(!rows.length){el.innerHTML=`<p class="note">No positions yet. Click a state, then Buy on any race.</p>`; return;}
  el.innerHTML=`<table class="tr"><tr><th>Race</th><th>Side</th><th>Qty</th><th>Avg</th><th>Now</th><th>P/L</th><th>${fin?"Result":""}</th></tr>`+rows.map(([k,p])=>{
    const v=posValue(p,sIdx), g=v-p.cost, m=midSide(p.kind,p.key,p.side,sIdx), won=fin?((p.side==="D")===P.data[p.kind][p.key].dem_won):null;
    return `<tr><td>${rLabel(p.kind,p.key)}</td><td>${p.side==="D"?"Dem":"Rep"} <span style="color:var(--mut)">${nameOf(p.kind,p.key,p.side)}</span></td><td>${p.n}</td><td>${Math.round(p.cost/p.n*100)}¢</td><td>${fin?"":(m==null?"":Math.round(m*100)+"¢")}</td><td class="${sMoneyCls(g)}">${g>=0?"+":""}${money(g)}</td><td>${fin?(won?"Won":"Lost"):`<button data-sell="${k}">Sell</button>`}</td></tr>`;}).join("")+`</table>`;
  el.querySelectorAll("button[data-sell]").forEach(b=>b.onclick=()=>sSell(b.dataset.sell));
}
function sPaintEq(){
  const el=document.getElementById("seq"), W=700,H=90,pad=8; const pts=sEq.map((v,i)=>[i,v]).filter(x=>x[1]!=null&&x[0]<=sIdx);
  const vs=pts.map(x=>x[1]).concat([0]), lo=Math.min(...vs), hi=Math.max(...vs), span=(hi-lo)||1, X=i=>pad+(W-2*pad)*i/(TN-1), Y=v=>H-pad-(H-2*pad)*(v-lo)/span;
  el.innerHTML=`<line x1="${pad}" x2="${W-pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/><path d="${pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="var(--acc)" stroke-width="2"/><text x="${pad}" y="12" font-size="11" fill="var(--mut)">Total P/L over time (dashed = break-even)</text>`;
}
function sPaint(){ sPaintSummary(); sPaintMap(); sPaintCards(); sPaintPositions(); sPaintEq(); }
function sMakeCard(it){
  const c=document.createElement("div"); c.className="rc";
  const nd=nameOf(it.kind,it.key,"D"), nr=nameOf(it.kind,it.key,"R");
  c.innerHTML=`<div class="rhead"><span class="rk">${it.label}</span><span class="rp"></span></div>`
   +`<button class="bd" title="Buy ${nd.replace(/"/g,"")} (Democratic)"><span class="nm">${nd}</span><span class="px">Buy</span></button>`
   +`<button class="br" title="Buy ${nr.replace(/"/g,"")} (Republican)"><span class="nm">${nr}</span><span class="px">Buy</span></button><div class="rh"></div>`;
  const card={kind:it.kind,key:it.key,tradable:!!T.series[it.kind][it.key],price:c.querySelector(".rp"),bD:c.querySelector(".bd"),bR:c.querySelector(".br"),hold:c.querySelector(".rh")};
  card.bD.onclick=()=>sBuy(it.kind,it.key,"D"); card.bR.onclick=()=>sBuy(it.kind,it.key,"R"); sCards.push(card); return c;
}
function sBuildState(){
  const box=document.getElementById("sstate"); sCards=[];
  if(!sState){box.innerHTML=`<h2>Pick a state</h2><p class="sub">Click a state on the map to see its governor, Senate and House races here.</p>`; return;}
  const st=P.geo.states.find(s=>s.abbr===sState), has=(k,key)=>!!P.data[k][key];
  box.innerHTML=`<h2>${st.name}</h2><p class="sub">Each button buys your bet size at the ask. Prices are the Democratic side. Scroll the House table sideways for more races.</p>`;
  const grid=document.createElement("div"); grid.className="sgrid";
  const big=document.createElement("div"); big.className="sbig";
  for(const [kind,title] of [["gov","Governor"],["sen","Senate"]]){
    const w=document.createElement("div"); w.innerHTML=`<div class="rt">${title}</div>`;
    if(has(kind,sState)) w.append(sMakeCard({kind,key:sState,label:st.name})); else w.insertAdjacentHTML("beforeend",`<div class="note" style="margin:0">No race in 2026.</div>`);
    big.append(w);
  }
  const hk=P.districts.filter(d=>d.state===sState).map(d=>d.key).sort();
  const hw=document.createElement("div"); hw.className="hwrap"; hw.innerHTML=`<div class="rt">House (${hk.length})</div>`;
  const tbl=document.createElement("div"); tbl.className="htable";
  for(const k of hk) tbl.append(sMakeCard({kind:"house",key:k,label:k}));
  hw.append(tbl); grid.append(big,hw); box.append(grid); sPaintCards();
}
function simView(root){
  root.innerHTML=`<div class="sim">
   <div class="sumbar"><div><span>Cash</span><b id="scash"></b></div><div><span>Open P/L</span><b id="sopen"></b></div><div><span>Total P/L</span><b id="stotal"></b></div>
    <label class="bet">Bet size ($)<input id="sbet" type="number" min="1" step="5" value="${sBet}"></label><div id="sfinal" class="fin"></div></div>
   <div class="simgrid"><div class="left"><svg id="smap" viewBox="${P.geo.x0} 0 ${P.geo.width} ${P.geo.height}" role="img" aria-label="Pick a state"></svg>
     <div id="sflash" class="flash" aria-live="polite"></div><h3 class="ph3">Positions</h3><div id="spos"></div><svg id="seq" viewBox="0 0 700 90" class="eq"></svg></div>
    <div id="sstate" class="sstate"></div></div>
   <div class="ctlbar"><button id="splay">Play</button><select id="sspeed" aria-label="Speed">${[[800,"0.5x"],[400,"1x"],[200,"2x"],[100,"4x"]].map(([v,l])=>`<option value="${v}" ${v===sSpeed?"selected":""}>${l}</option>`).join("")}</select>
    <input id="srange" type="range" min="0" max="${TN-1}" value="${sIdx}" aria-label="Time"><span id="stime" class="tl"></span><button id="sreset">Reset</button></div></div>`;
  const svg=document.getElementById("smap");
  for(const s of P.geo.states){const p=document.createElementNS(NS,"path"); p.setAttribute("d",s.d); p.setAttribute("class","state hit"); p.dataset.st=s.abbr; p.setAttribute("tabindex",0); p.setAttribute("aria-label",s.name);
    const pick=()=>{sState=s.abbr; sBuildState(); sPaintMap();}; p.addEventListener("click",pick); p.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}}); svg.appendChild(p);}
  const b=document.createElementNS(NS,"path"); b.setAttribute("d",P.geo.borders); b.setAttribute("class","borders"); svg.appendChild(b);
  document.getElementById("sbet").oninput=e=>{sBet=Math.max(1,+e.target.value||1); sPaintCards();};
  document.getElementById("sspeed").onchange=e=>{sSpeed=+e.target.value; if(sTimer){clearInterval(sTimer);sTimer=setInterval(()=>sAdvance(sIdx+1),sSpeed);}};
  document.getElementById("splay").onclick=()=>{ if(sTimer){clearInterval(sTimer);sTimer=null;sPaintSummary();return;} if(sIdx>=TN-1){flash("Market closed: press Reset to start over.");return;} sTimer=setInterval(()=>sAdvance(sIdx+1),sSpeed); sPaintSummary(); };
  document.getElementById("srange").oninput=e=>{const v=+e.target.value; if(v<=sIdx){e.target.value=sIdx; return;} sAdvance(v);};
  document.getElementById("sreset").onclick=()=>{sReset(); sPaint();};
  sBuildState(); sPaint();
}

function placeholder(title,txt){const d=document.createElement("div");d.className="ph";d.innerHTML=`<b>${title}</b>${txt}`;return d;}
function render(id){
  clearInterval(sTimer); sTimer=null; clearInterval(pTimer); pTimer=null;
  document.getElementById("left")?.remove(); document.querySelector("main").classList.remove("timing");
  clearInterval(timer); timer=null; stage.classList.remove("tm"); stage.replaceChildren(); tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  curTab=id; if(id!=="time") side.innerHTML=`<h2>Hover or tap a state</h2><p style="color:var(--mut);margin:0;font-size:13px">Details for the race show here.</p>`+resInfo();
  document.querySelector("main").classList.toggle("wide",id==="results"||id==="profit"); document.querySelector("main").classList.toggle("prof",id==="profit");
  if(id==="results"){ resultsView(); }
  else if(id==="time"){ timingView(); }
  else profitView();
}
for(const [id,label] of TABS){const b=document.createElement("button");b.textContent=label;b.dataset.id=id;b.setAttribute("role","tab");b.onclick=()=>render(id);tabs.append(b);}
render(TABS.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):"time");
</script></body></html>
